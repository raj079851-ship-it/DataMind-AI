# =====================================================================
# Alembic Migration Configuration for DataMind AI
# =====================================================================

[alembic]
script_location = backend/database/migrations
prepend_sys_path = .
version_path_separator = os

# Default fallback URL (overridden dynamically in env.py from environment variables)
sqlalchemy.url = postgresql://postgres:8210@localhost:5432/analytics_platform

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
