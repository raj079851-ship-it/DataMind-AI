<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90" fill="none">
  <!-- Brand Icon at (10, 10), 70x70 -->
  <g transform="translate(10, 10) scale(0.5833)">
    <defs>
    <linearGradient id="shieldGrad_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131C28" />
      <stop offset="100%" stop-color="#090D12" />
    </linearGradient>
    
    <linearGradient id="dGrad_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4573AE" />
      <stop offset="45%" stop-color="#2A5288" />
      <stop offset="100%" stop-color="#142844" />
    </linearGradient>
    
    <linearGradient id="goldGrad_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED9B3" />
      <stop offset="50%" stop-color="#C5A46D" />
      <stop offset="100%" stop-color="#9E7D47" />
    </linearGradient>

    <filter id="glow_dark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#shieldGrad_dark)" stroke="#243447" stroke-width="1.5" />
  
  <!-- Subtle Champagne Gold Specular Rim -->
  <rect x="5.5" y="5.5" width="109" height="109" rx="26.5" fill="none" stroke="url(#goldGrad_dark)" stroke-width="1" stroke-opacity="0.7" />

  <!-- Unified Geometric "D" Silhouette (Outer wall: 16px thickness) -->
  <path d="M 28 30
           C 28 26.5 30.5 24 34 24
           L 62 24
           C 82 24 96 38 96 60
           C 96 82 82 96 62 96
           L 34 96
           C 30.5 96 28 93.5 28 90
           Z
           M 44 40
           L 44 80
           L 60 80
           C 72 80 80 71 80 60
           C 80 49 72 40 60 40
           Z"
        fill="url(#dGrad_dark)" fill-rule="evenodd" />

  <!-- Inner Dynamic Gold Accent Rail -->
  <path d="M 44 42
           L 59 42
           C 70 42 77 50 77 60
           C 77 70 70 78 59 78
           L 44 78"
        stroke="url(#goldGrad_dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />

  <!-- Neural Intelligence Grid & Data Vectors -->
  <line x1="44" y1="60" x2="61" y2="60" stroke="url(#goldGrad_dark)" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <line x1="61" y1="60" x2="72" y2="48" stroke="url(#goldGrad_dark)" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />
  <line x1="61" y1="60" x2="72" y2="72" stroke="url(#goldGrad_dark)" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />

  <!-- Peripheral Neural Data Nodes -->
  <circle cx="72" cy="48" r="3.2" fill="#EED9B3" stroke="#2A5288" stroke-width="1" filter="url(#glow_dark)" />
  <circle cx="72" cy="72" r="3.2" fill="#EED9B3" stroke="#2A5288" stroke-width="1" filter="url(#glow_dark)" />
  <circle cx="44" cy="60" r="2.8" fill="#2A5288" stroke="#C5A46D" stroke-width="1.5" />

  <!-- Central Intelligence Nexus Spark (Faceted Diamond Core) -->
  <path d="M 61 53 L 67 60 L 61 67 L 55 60 Z" fill="url(#goldGrad_dark)" filter="url(#glow_dark)" />
  <circle cx="61" cy="60" r="1.8" fill="#FFFFFF" />

  </g>

  <!-- Typography: DataMind AI Wordmark -->
  <text x="96" y="47" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.03em" fill="#F5F5F2">
    DataMind <tspan fill="#C5A46D" font-weight="900">AI</tspan>
  </text>

  <!-- Tagline: ANALYZE • PREDICT • EMPOWER -->
  <text x="97" y="66" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="0.22em" fill="#9CA8B5">
    ANALYZE • PREDICT • EMPOWER
  </text>
</svg>